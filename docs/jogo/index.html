<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B5121B">
  <title>The Warrior</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone-192.png">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="stylesheet" href="placar.css">
  <link rel="stylesheet" href="estilo.css">
  <script src="config.js"></script>
  <script src="placar.js"></script>
  <script src="placar-ui.js"></script>
  <script src="regras.js"></script>
  <script src="pwa.js" defer></script>
  <script src="jogo.js" defer></script>
</head>
<body>
  <main class="jogo">
    <header class="topo"><h1 id="titulo">The Warrior</h1><p>Recorde: <strong id="melhor">0</strong></p></header>
    <section id="tela-inicio" class="tela">
      <div class="brasao" aria-hidden="true">🛡️</div>
      <p class="instrucao">Acerte moedas, poções e escudos. Evite a caveira proibida! Você tem 30 segundos.</p>
      <button id="botao-jogar" class="botao" type="button">Entrar na arena</button>
    </section>
    <section id="tela-jogo" class="tela" hidden aria-label="Partida">
      <div class="status"><span>⏳ <strong id="tempo">30</strong>s</span><span>⭐ <strong id="pontos">0</strong></span><span>Combo: <strong id="combo">0</strong></span></div>
      <p id="mensagem" class="mensagem" aria-live="polite">Toque nos itens bons!</p>
      <div id="arena" class="arena" role="group" aria-label="Arena medieval"></div>
    </section>
    <section id="tela-fim" class="tela" hidden aria-label="Fim da partida">
      <div class="brasao" aria-hidden="true">🏆</div>
      <p class="instrucao">A batalha acabou! Sua pontuação: <strong id="resultado">0</strong></p>
      <p id="situacao-salvamento" role="status" aria-live="polite"></p>
      <button id="botao-de-novo" class="botao" type="button">Jogar de novo</button>
    </section>
    <aside id="painel-placar" aria-label="Placar"></aside>
  </main>
</body>
</html>
